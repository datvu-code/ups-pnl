<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bao cao ket qua kinh doanh</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-header: #f8f9fa;
      --bg-header-sub: #f1f3f5;
      --text-header: #495057;
      --border: #e9ecef;
      --bg-row-hover: #f8f9fa;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --text-primary: #212529;
      --text-secondary: #868e96;
      --tree-line: #dee2e6;
      --frozen-shadow: 4px 0 8px rgba(0,0,0,0.04);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: #fff;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .report-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
    }

    .report-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .report-header .unit {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .table-wrapper {
      flex: 1;
      overflow: auto;
      position: relative;
      background: var(--bg);
      min-height: 0;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }

    thead { position: sticky; top: 0; z-index: 30; }

    thead th {
      background: var(--bg-header);
      color: var(--text-header);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.03em;
      padding: 12px 24px;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    thead th:first-child { text-align: center; width: 80px; min-width: 80px; }
    thead th:nth-child(2) { text-align: left; min-width: 380px; width: 380px; }

    thead th.frozen-code {
      position: sticky; left: 0; z-index: 32;
      background: var(--bg-header);
    }

    thead th.frozen-name {
      position: sticky; left: 80px; z-index: 32;
      background: var(--bg-header);
      box-shadow: var(--frozen-shadow);
    }

    thead .sub-header th {
      background: var(--bg-header-sub);
      font-size: 11px;
      padding: 8px 24px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr { transition: background 0.12s; }
    tbody tr:hover { background: var(--bg-row-hover); }

    tbody td {
      padding: 11px 24px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: right;
      font-variant-numeric: tabular-nums;
      position: relative;
    }

    tbody td:first-child {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    tbody td:nth-child(2) { text-align: left; }

    tbody td.frozen-code {
      position: sticky; left: 0; z-index: 10;
      background: inherit;
    }

    tbody td.frozen-name {
      position: sticky; left: 80px; z-index: 10;
      background: inherit;
      box-shadow: var(--frozen-shadow);
    }

    /* Row levels */
    tr[data-level="0"] { background: var(--bg); font-weight: 600; }
    tr[data-level="0"] td:nth-child(2) { padding-left: 16px; }
    tr[data-level="1"] { background: var(--bg); }
    tr[data-level="1"] td:nth-child(2) { padding-left: 36px; }
    tr[data-level="2"] { background: var(--bg); }
    tr[data-level="2"] td:nth-child(2) { padding-left: 56px; }
    tr[data-level="3"] { background: var(--bg); }
    tr[data-level="3"] td:nth-child(2) { padding-left: 76px; }
    tr[data-level="4"] { background: var(--bg); }
    tr[data-level="4"] td:nth-child(2) { padding-left: 96px; }

    /* Frozen cell bg */
    tr td.frozen-code, tr td.frozen-name { background: var(--bg); }
    tr:hover td.frozen-code, tr:hover td.frozen-name { background: var(--bg-row-hover) !important; }

    /* Tree line */
    .tree-line td.frozen-name::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: var(--tree-line);
      pointer-events: none;
    }

    tr[data-level="1"].tree-line td.frozen-name::after { left: 24px; }
    tr[data-level="2"].tree-line td.frozen-name::after { left: 44px; }
    tr[data-level="3"].tree-line td.frozen-name::after { left: 64px; }
    tr[data-level="4"].tree-line td.frozen-name::after { left: 84px; }

    /* Left accent border */
    .accent-border td.frozen-name::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .accent-blue td.frozen-name::before { background: var(--accent-blue); }
    .accent-green td.frozen-name::before { background: var(--accent-green); }
    .accent-orange td.frozen-name::before { background: var(--accent-orange); }
    .accent-purple td.frozen-name::before { background: var(--accent-purple); }
    .accent-red td.frozen-name::before { background: var(--accent-red); }

    /* Chevron toggle */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border: none; background: none;
      cursor: pointer;
      color: var(--text-secondary);
      margin-right: 6px; padding: 0;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .toggle-btn:hover { color: var(--text-primary); }
    .toggle-btn svg { width: 14px; height: 14px; transition: transform 0.2s; }
    .toggle-btn.collapsed svg { transform: rotate(-90deg); }

    .name-content { display: inline-flex; align-items: center; }
    .toggle-placeholder { display: inline-flex; width: 20px; height: 20px; margin-right: 6px; flex-shrink: 0; }

    tr.row-hidden { display: none; }

    /* Growth rate colors */
    .growth-positive { color: var(--accent-green); }
    .growth-negative { color: var(--accent-red); }
    .growth-zero { color: var(--text-secondary); }

    /* Row 10 - sticky bottom inside table */
    tr.sticky-total {
      position: sticky;
      bottom: 0;
      z-index: 20;
      background: var(--bg) !important;
      font-weight: 700;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    }

    tr.sticky-total td {
      border-top: 2px solid var(--border);
      border-bottom: none;
      padding-top: 13px;
      padding-bottom: 13px;
    }

    tr.sticky-total td.frozen-code,
    tr.sticky-total td.frozen-name {
      background: var(--bg) !important;
      z-index: 22;
    }

    tr.sticky-total:hover td.frozen-code,
    tr.sticky-total:hover td.frozen-name {
      background: var(--bg) !important;
    }

    /* Scrollbar */
    .table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrapper::-webkit-scrollbar-track { background: #f8f9fa; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 3px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: #adb5bd; }
  </style>
</head>

          { code: "6.4.2", name: "CP qua tang theo seller", level: 2, children: false, parentId: "6.4", values: [1425355.63, 1425355.63, 5236524.49, 4224271.26, 0], growth: [-72.78, 100, 23.96] },
          { code: "6.4.3", name: "Giam gia ban hang", level: 2, children: false, parentId: "6.4", values: [11253642, 11253642, 58872495, 50216919, 0], growth: [-80.88, 100, 17.24] },
      { code: "7", name: "Chi phi van hanh noi bo", level: 0, children: false, values: [0, 0, 0, 0, 0], growth: [0, 0, 0] },
      { code: "8", name: "Loi nhuan thuan", level: 0, children: false, values: [50536677.38, 37255939.95, 100399594.85, 87499861.03, 0], growth: [-62.89, 100, 14.74] },
      { code: "9", name: "Chi phi khac", level: 0, children: false, values: [0, 0, 0, 0, 0], growth: [0, 0, 0] },
    ];

    // Row 10 is part of the table but sticky at bottom
    const totalRow = { code: "10", name: "Tong loi nhuan ke toan truoc thue", level: 0, accent: "accent-green", values: [50536677.38, 37255939.95, 100399594.85, 87499861.03, 0], growth: [-62.89, 100, 14.74] };

    function formatNumber(val) {
      if (val === 0) return '-';
      const negative = val < 0;
      const abs = Math.abs(val);
      const formatted = Number.isInteger(abs)
        ? abs.toLocaleString('en-US')
        : abs.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      return negative ? `(${formatted})` : formatted;
    }

    function formatGrowth(val) {
      if (val === 0) return '<span class="growth-zero">-</span>';
      const cls = val > 0 ? 'growth-positive' : 'growth-negative';
      const arrow = val > 0 ? '&#9650;' : '&#9660;';
      return `<span class="${cls}">${arrow} ${Math.abs(val).toFixed(2)}%</span>`;
    }

    function chevronSvg() {
      return `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,4 6,7 9,4"/></svg>`;
    }

    function renderTable() {
      const tbody = document.getElementById('pnlBody');
      let html = '';

      rawData.forEach((row) => {
        const accentClass = row.accent ? `accent-border ${row.accent}` : '';
        const treeClass = row.level > 0 ? 'tree-line' : '';

        html += `<tr data-code="${row.code}" data-level="${row.level}" data-parent="${row.parentId || ''}" class="${accentClass} ${treeClass}">`;
        html += `<td class="frozen-code">${row.code}</td>`;
        html += `<td class="frozen-name"><span class="name-content">`;
        if (row.children) {
          html += `<button class="toggle-btn" onclick="toggleRow('${row.code}')" data-toggle="${row.code}">${chevronSvg()}</button>`;
        } else {
          html += `<span class="toggle-placeholder"></span>`;
        }
        html += `${row.name}</span></td>`;
        row.values.forEach(v => { html += `<td>${formatNumber(v)}</td>`; });
        row.growth.forEach(g => { html += `<td>${formatGrowth(g)}</td>`; });
        html += '</tr>';
      });

      // Row 10 - inside table, sticky bottom
      const r = totalRow;
      html += `<tr data-code="${r.code}" data-level="0" class="sticky-total accent-border ${r.accent}">`;
      html += `<td class="frozen-code">${r.code}</td>`;
      html += `<td class="frozen-name"><span class="name-content"><span class="toggle-placeholder"></span>${r.name}</span></td>`;
      r.values.forEach(v => { html += `<td>${formatNumber(v)}</td>`; });
      r.growth.forEach(g => { html += `<td>${formatGrowth(g)}</td>`; });
      html += '</tr>';

      tbody.innerHTML = html;
    }

    function toggleRow(code) {
      const btn = document.querySelector(`[data-toggle="${code}"]`);
      const isCollapsing = !btn.classList.contains('collapsed');
      btn.classList.toggle('collapsed');

      const rows = document.querySelectorAll('#pnlBody tr');

      if (isCollapsing) {
        const codesToHide = new Set();
        function collectChildren(parentCode) {
          rows.forEach(r => {
            if (r.dataset.parent === parentCode) {
              codesToHide.add(r.dataset.code);
              collectChildren(r.dataset.code);
            }
          });
        }
        collectChildren(code);
        rows.forEach(r => {
          if (codesToHide.has(r.dataset.code)) r.classList.add('row-hidden');
        });
        codesToHide.forEach(c => {
          const cb = document.querySelector(`[data-toggle="${c}"]`);
          if (cb) cb.classList.add('collapsed');
        });
      } else {
        rows.forEach(r => {
          if (r.dataset.parent === code) {
            r.classList.remove('row-hidden');
            const cb = document.querySelector(`[data-toggle="${r.dataset.code}"]`);
            if (cb) cb.classList.add('collapsed');
          }
        });
      }
    }

    renderTable();
  </script>
</body>
</html>
